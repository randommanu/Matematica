<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Contas de Cabeça</title>
<meta name="theme-color" content="#F4F5FB">
<meta name="description" content="Treino diário de cálculo mental">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Contas">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F5FB;--card:#fff;--tx:#14172B;--mut:#6B7090;--pri:#6B5CE7;--g:#D3EBE1;--p:#FBD3E3;--l:#DCCFF2;--o:#FBE2CF;--gs:#3FB58A;--sh:0 8px 24px rgba(40,40,90,.08);--line:rgba(20,23,43,.08);--bad:#E5646E}
[data-theme=dark]{--bg:#0E1120;--card:#1A1E33;--tx:#EEF0FF;--mut:#9A9FC4;--g:#1F3B32;--p:#43243A;--l:#2E2750;--o:#44301F;--sh:0 8px 24px rgba(0,0,0,.35);--line:rgba(255,255,255,.09);--pri:#8A7DF5;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-weight:600;line-height:1.35}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
.app{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 16px) 18px calc(120px + env(safe-area-inset-bottom))}
.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
h1{font-size:24px;font-weight:800;margin:0}h2{font-size:19px;font-weight:800;margin:0}
.ib{width:44px;height:44px;border-radius:50%;background:var(--card);box-shadow:var(--sh);font-size:19px;display:grid;place-items:center}
.card{background:var(--card);border-radius:30px;box-shadow:var(--sh);padding:20px}
.acts{display:grid;gap:12px}
.act{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border-radius:32px;padding:20px 20px 20px 24px}
.act>div{flex:1}.act b{display:block;font-size:22px;font-weight:800}.act .sub{font-size:13px;opacity:.75}
.go{width:48px;height:48px;flex:none;border-radius:50%;background:var(--tx);color:var(--bg);display:grid;place-items:center;font-size:22px}
.c-g{background:var(--g)}.c-p{background:var(--p)}.c-l{background:var(--l)}.c-o{background:var(--o)}
.btn{background:var(--pri);color:#fff;border-radius:26px;padding:17px 28px;font-weight:800;font-size:17px;width:100%}
.btn:disabled{opacity:.4;cursor:default}.btn.alt{background:var(--card);color:var(--tx);box-shadow:var(--sh)}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:26px;padding:14px 18px;margin-top:10px;box-shadow:var(--sh)}
.row b{font-size:18px;font-weight:800;white-space:nowrap}.row span{flex:1;font-size:12px;color:var(--mut);text-align:right}
.empty{text-align:center;color:var(--mut);padding:26px 14px;font-size:14px}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));width:min(calc(100% - 28px),492px);background:var(--card);border-radius:34px;box-shadow:0 10px 34px rgba(30,30,80,.18);padding:8px;display:flex;gap:6px;z-index:10}
.nav button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;padding:6px 0;border-radius:26px;font-size:11px;font-weight:700;color:var(--mut)}
.nav .sy{font-size:26px;font-weight:800;line-height:1.1}.nav button.on{background:var(--l);color:var(--pri)}
.ov{position:fixed;inset:0;background:var(--bg);z-index:50;overflow:auto;user-select:none;-webkit-user-select:none}.ov[hidden]{display:none}
.ovi{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 14px) 20px calc(20px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between}.cnt{font-weight:800;font-size:18px}
.bar{height:12px;border-radius:8px;background:var(--line);overflow:hidden;margin:16px 0}.bar i{display:block;height:100%;background:var(--pri);transition:width .3s}
.qa{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:6px 0}
.q{font-size:clamp(40px,12vw,68px);font-weight:800;white-space:nowrap}
#ans{width:220px;max-width:100%;height:76px;display:grid;place-items:center;font-size:44px;font-weight:800;background:var(--card);border:3px solid var(--pri);border-radius:30px;box-shadow:var(--sh)}
#ans:empty::before{content:'?';color:var(--mut);opacity:.5}#ans.ok{border-color:var(--gs);background:var(--g)}#ans.bad{border-color:var(--bad);animation:sh .3s}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding-top:10px}
.kp button{height:clamp(52px,8.4vh,68px);border-radius:24px;background:var(--card);box-shadow:var(--sh);font-size:26px;font-weight:800;touch-action:manipulation}
.kp button:active{background:var(--l)}.kp .kok{background:var(--pri);color:#fff}.kp.off button:not(.kok){opacity:.35}
.fb{min-height:30px;font-size:20px;font-weight:800;text-align:center}.fb.ok{color:var(--gs)}.fb.bad{color:var(--bad)}
pre.dr{font:700 20px/1.25 ui-monospace,Menlo,Consolas,monospace;background:var(--card);color:var(--tx);border-radius:20px;padding:14px 18px;margin:10px 0 0;display:inline-block;text-align:left;max-width:100%;overflow:auto;box-shadow:var(--sh)}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.res{text-align:center;padding:30px 0 10px}.res .big{font-size:72px;font-weight:800}.res p{margin:4px 0;color:var(--mut)}
.errs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0}.errs span{background:var(--p);border-radius:16px;padding:6px 12px;font-size:14px}
.acts2{display:grid;gap:10px;margin-top:auto;padding-top:20px}
</style>
</head>
<body>
<div class="app"><div class="head"><h1 id="ttl"></h1><div style="display:flex;gap:10px"><button class="ib" data-a="tab" data-v="rev" aria-label="Revisão geral">🔁</button><button class="ib" id="thm" data-a="theme" aria-label="Alternar tema"></button></div></div><main id="view"></main></div>
<nav class="nav" aria-label="Operações">
<button data-a="tab" data-v="+"><span class="sy">+</span>Adição</button>
<button data-a="tab" data-v="-"><span class="sy">−</span>Subtração</button>
<button data-a="tab" data-v="*"><span class="sy">×</span>Multiplic.</button>
<button data-a="tab" data-v="/"><span class="sy">÷</span>Divisão</button>
</nav>
<div class="ov" id="ov" hidden></div>
<script>
const KEY='contas-v2',$=s=>document.querySelector(s);
const OPS={'+':{n:'Adição',c:'c-g'},'-':{n:'Subtração',c:'c-p'},'*':{n:'Multiplicação',c:'c-l'},'/':{n:'Divisão',c:'c-o'}};
const SYM={'+':'+','-':'−','*':'×','/':'÷'};
let S={f:{},sess:0,theme:null};
try{const o=JSON.parse(localStorage.getItem(KEY));if(o&&o.f)S=Object.assign(S,o)}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
let tab='+',Q=null;
const rng=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=rng(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const parse=k=>[k[0],k.slice(2).split(',').map(Number)];
const calc=(o,x,y)=>o=='+'?x+y:o=='-'?x-y:o=='*'?x*y:x/y;
const ansOf=(o,n)=>n.reduce((x,y)=>calc(o,x,y));
const fmtQ=(o,n)=>n.join(' '+SYM[o]+' ');

/* contas: chave = operação|números (ex.: +|12,7) */
function pool(op,L){const r=[],k=(...n)=>r.push(op+'|'+n.join(','));
 if(L==3){const s=new Set();while(s.size<30){let a,b,c;
  if(op=='+'){a=rng(1,20);b=rng(1,20);c=rng(1,20)}
  else if(op=='-'){a=rng(3,20);b=rng(1,a-1);c=rng(1,a-b)}
  else if(op=='*'){a=rng(2,20);b=rng(2,20);c=rng(2,20)}
  else{b=rng(2,10);c=rng(2,10);a=rng(2,20)*b*c}
  s.add(op+'|'+[a,b,c])}return[...s]}
 if(op=='/'){for(let d=2;d<=(L==1?10:20);d++)for(let q=L==1?2:11;q<=(L==1?10:20);q++)k(d*q,d)}
 else{const A=L==1?[2,10]:[11,20];for(let a=A[0];a<=A[1];a++)for(let b=op=='*'?2:1;b<=a;b++)k(a,b)}
 return r}
const isM=k=>S.f[k]&&S.f[k].run>=3;
const hard=op=>Object.keys(S.f).filter(k=>(!op||k[0]==op)&&S.f[k].ok<S.f[k].tot&&S.f[k].run<3);

/* desenho da conta armada */
function ldiv(a,b){const s=String(a),n=s.length,L=[],row=(t,e)=>t.padStart(e+1);let r=0,q='',sh=false;
 for(let i=0;i<n;i++){const c=r*10+ +s[i],d=Math.floor(c/b);
  if(!sh&&!d&&i<n-1){r=c;continue}
  q+=d;const p=d*b,m='−'+p;if(sh)L.push(row(String(c),i));
  L.push(row(m,i),row('─'.repeat(m.length),i));r=c-p;sh=true;
  if(i==n-1)L.push(row(String(r),i))}
 return s+' │ '+b+'\n'+' '.repeat(n)+' │ '+q+'\n'+L.join('\n')}
function sheet(o,x,y,r){
 if(o=='/')return ldiv(x,y);
 const X=String(x),Y=String(y),R=String(r);
 if(o=='*'&&Y.length>1){const P=[...Y].reverse().map((d,i)=>String(x*d)+' '.repeat(i)),W=Math.max(X.length,R.length,...P.map(p=>p.length))+2;
  return[X.padStart(W),('×'+Y).padStart(W),'─'.repeat(W),...P.map(p=>p.padStart(W)),'─'.repeat(W),R.padStart(W)].join('\n')}
 const W=Math.max(X.length,Y.length+1,R.length)+1;
 return[X.padStart(W),(SYM[o]+Y).padStart(W),'─'.repeat(W),R.padStart(W)].join('\n')}
function draw(o,n){let t=n[0],out=[];for(let i=1;i<n.length;i++){const r=calc(o,t,n[i]);out.push((n.length>2?t+' '+SYM[o]+' '+n[i]+' = '+r+'\n':'')+sheet(o,t,n[i],r));t=r}return out.join('\n\n')}

/* telas */
const list=h=>h.length?h.slice(0,60).map(k=>{const f=S.f[k],[o,n]=parse(k);return`<div class="row"><b>${fmtQ(o,n)}</b><span>${f.ok} de ${f.tot} certas · ${f.run}/3 seguidas</span></div>`}).join(''):'<div class="card empty" style="margin-top:12px">Nenhuma conta para revisar por enquanto. 🎉</div>';
function page(op){const O=OPS[op],h=hard(op);
 return`<div class="acts">${[1,2,3].map(L=>{const P=L<3?pool(op,L):[],d=L<3?P.filter(isM).length+' de '+P.length+' dominadas':'30 sorteadas por treino';
  return`<button class="act ${O.c}" data-a="play" data-v="${op}|${L}"><div><b>Nível ${L}</b><span class="sub">${['','Contas de 2 a 10','Contas de 11 a 20','Três números de 1 a 20'][L]} · ${d}</span></div><span class="go">→</span></button>`}).join('')}</div>
 <section class="card c-l" style="margin-top:16px"><h2>Revisão de ${O.n}</h2><p style="margin:6px 0 14px;font-size:14px;opacity:.75">${h.length} ${h.length==1?'conta errada':'contas erradas'}. Saem daqui quando você acerta 3 vezes seguidas.</p><button class="btn" data-a="play" data-v="${op}|r" ${h.length?'':'disabled'}>Treinar revisão</button></section>${list(h)}`}
function rev(){const h=hard();
 return`<section class="card c-l"><h2>${h.length} ${h.length==1?'conta para revisar':'contas para revisar'}</h2><p style="margin:6px 0 14px;font-size:14px;opacity:.75">Todas as operações juntas.</p><button class="btn" data-a="play" data-v="all|r" ${h.length?'':'disabled'}>Treinar tudo</button></section>${list(h)}`}
function theme(){const t=S.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.dataset.theme=t;
 $('meta[name=theme-color]').content=t=='dark'?'#0E1120':'#F4F5FB';$('#thm').textContent=t=='dark'?'☀️':'🌙'}
function render(){$('#ttl').textContent=tab=='rev'?'Revisão geral':OPS[tab].n;$('#view').innerHTML=tab=='rev'?rev():page(tab);
 document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===tab));theme()}

/* sessão */
function start(v){const[op,L]=v.split('|'),l=L=='r'?hard(op=='all'?null:op):pool(op,+L);if(!l.length)return;
 Q={list:shuffle(l.slice()),i:0,ok:0,errs:[]};$('#ov').hidden=false;document.body.style.overflow='hidden';$('#ov').innerHTML='';renderQ()}
function renderQ(){
 if(!$('#ans'))$('#ov').innerHTML=`<div class="ovi"><div class="top"><button class="ib" data-a="exit" aria-label="Sair">✕</button><div class="cnt" id="cnt"></div><div style="width:44px"></div></div><div class="bar"><i id="pg"></i></div>
 <div class="qa"><div class="q" id="qq"></div><div id="ans" role="status"></div><div class="fb" id="fb" aria-live="polite"></div></div>
 <div class="kp" id="kp">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-a="key" data-v="${n}">${n}</button>`).join('')}<button data-a="del" aria-label="Apagar">⌫</button><button data-a="key" data-v="0">0</button><button class="kok" id="gob" data-a="go" aria-label="Conferir">✓</button></div></div>`;
 const[o,n]=parse(Q.list[Q.i]);Q.op=o;Q.n=n;Q.ans=ansOf(o,n);Q.tries=0;Q.val='';Q.busy=false;Q.final=false;
 const d=(o=='+'||o=='*')&&n.length==2&&Math.random()<.5?n.slice().reverse():n;
 $('#cnt').textContent=(Q.i+1)+'/'+Q.list.length;$('#pg').style.width=Q.i/Q.list.length*100+'%';$('#qq').textContent=fmtQ(o,d);
 $('#ans').className='';$('#ans').textContent='';$('#fb').textContent='';$('#fb').className='fb';$('#kp').classList.remove('off');$('#gob').textContent='✓'}
const press=d=>{if(!Q||Q.busy||Q.final||Q.val.length>=5)return;Q.val+=d;$('#ans').textContent=Q.val};
const del=()=>{if(!Q||Q.busy||Q.final)return;Q.val=Q.val.slice(0,-1);$('#ans').textContent=Q.val};
function record(k,ok){const f=S.f[k]||(S.f[k]={ok:0,tot:0,run:0});f.tot++;if(ok){f.ok++;f.run++}else f.run=0;save()}
function go(){if(!Q||Q.busy)return;if(Q.final){next();return}if(!Q.val)return;
 const k=Q.list[Q.i],q=Q,ans=$('#ans'),fb=$('#fb'),ok=+Q.val===Q.ans;
 if(ok){if(!Q.tries){record(k,true);Q.ok++}ans.className='ok';fb.textContent=Q.tries?'Agora sim!':['Isso aí!','Muito bem!','Certo!','Perfeito!'][rng(0,3)];fb.className='fb ok';Q.busy=true;setTimeout(()=>{if(Q===q)next()},700)}
 else if(Q.tries<2){if(!Q.tries){record(k,false);Q.errs.push(k)}Q.tries++;ans.className='bad';fb.textContent=Q.tries==1?'Quase! Tente de novo.':'Última chance!';fb.className='fb bad';Q.busy=true;
  setTimeout(()=>{if(Q===q){q.val='';ans.textContent='';ans.className='';q.busy=false}},700)}
 else{Q.final=true;ans.className='bad';fb.innerHTML=`${fmtQ(Q.op,Q.n)} = <b>${Q.ans}</b><br><pre class="dr"></pre>`;fb.querySelector('pre').textContent=draw(Q.op,Q.n);fb.className='fb bad';$('#kp').classList.add('off');$('#gob').textContent='→'}}
function next(){Q.i++;Q.i>=Q.list.length?finish():renderQ()}
function finish(){S.sess++;save();const n=Q.list.length,r=Q.ok/n,q=Q;
 $('#ov').innerHTML=`<div class="ovi"><div class="res"><div style="font-size:48px">${r>=.9?'🏆':r>=.7?'🎉':'💪'}</div><h2>Treino concluído!</h2><div class="big">${q.ok}/${n}</div><p>Acertos de primeira</p>
 ${q.errs.length?`<p style="margin-top:16px">Foram para a revisão (${q.errs.length}):</p><div class="errs">${q.errs.map(k=>{const[o,m]=parse(k);return`<span>${fmtQ(o,m)} = ${ansOf(o,m)}</span>`}).join('')}</div>`:'<p style="margin-top:16px">Sem nenhum erro. Parabéns!</p>'}</div>
 <div class="acts2"><button class="btn" data-a="again" data-v="${tabV}">Treinar de novo</button><button class="btn alt" data-a="close">Voltar</button></div></div>`}
let tabV='';
function closeQ(){Q=null;$('#ov').hidden=true;document.body.style.overflow='';render()}

document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,v=t.dataset.v;
 if(a=='tab'){tab=v;render();scrollTo(0,0)}
 else if(a=='play'||a=='again'){tabV=v;start(v)}
 else if(a=='theme'){S.theme=document.documentElement.dataset.theme=='dark'?'light':'dark';save();theme()}
 else if(a=='key')press(v);else if(a=='del')del();else if(a=='go')go()
 else if(a=='exit'){if(confirm('Sair do treino?'))closeQ()}
 else if(a=='close')closeQ()});
document.addEventListener('keydown',e=>{if(!Q||$('#ov').hidden)return;
 if(/^\d$/.test(e.key)){e.preventDefault();press(e.key)}else if(e.key=='Backspace'){e.preventDefault();del()}else if(e.key=='Enter'){e.preventDefault();go()}});
render();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
